name: Deploy Lambda

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Zip and Deploy Lambda
        run: |
          # Entriamo nella cartella dove risiede il codice
          cd lambda
          zip ../function.zip lambda_function.py
          cd ..
          # Aggiorna il codice della funzione (Assicurati che il nome coincida con Terraform)
          aws lambda update-function-code --function-name CloudRegistry_Logic --zip-file fileb://function.zip