<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Registro Cloud Pro</title>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1000.0.min.js"></script>
    <script src="https://unpkg.com/amazon-cognito-identity-js@5.2.9/dist/amazon-cognito-identity.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            max-width: 900px;
            margin: 2rem auto;
            background: #f4f6f8;
            color: #333;
        }

        .box {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: none;
            margin-bottom: 20px;
        }

        .visible {
            display: block;
            animation: fadeIn 0.5s;
        }

        input,
        select,
        button {
            width: 100%;
            margin: 8px 0;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }

        button {
            background: #0073bb;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #005f99;
        }

        button.secondary {
            background: #6c757d;
        }

        button.small {
            width: auto;
            padding: 5px 15px;
            font-size: 0.9rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #0073bb;
            color: white;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #eef;
            padding: 15px;
            border-radius: 8px;
        }

        .voto-card {
            border-left: 5px solid #28a745;
            padding: 15px;
            margin: 10px 0;
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .media-badge {
            float: right;
            background: #0073bb;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <h1 style="text-align:center; color:#0073bb;">☁️ Registro Cloud</h1>

    <div id="view-login" class="box visible">
        <h2>🔐 Accedi</h2>
        <input type="text" id="login-user" placeholder="Email">
        <input type="password" id="login-pass" placeholder="Password">
        <button onclick="login()">Entra</button>
        <button class="secondary" onclick="switchView('view-register')">Registrati</button>
    </div>

    <div id="view-register" class="box">
        <h2>📝 Nuova Registrazione</h2>
        <input type="text" id="reg-name" placeholder="Nome (es. Mario)">
        <input type="text" id="reg-surname" placeholder="Cognome (es. Rossi)">
        <input type="text" id="reg-email" placeholder="Email">
        <input type="password" id="reg-pass" placeholder="Password (es. Password123!)">
        <select id="reg-role" onchange="toggleClasseInput()">
            <option value="Student">Studente</option>
            <option value="Teacher">Docente</option>
        </select>
        <input type="text" id="reg-class" placeholder="Classe (es. 5A)">
        <button onclick="register()">Crea Account</button>
        <button class="secondary" onclick="switchView('view-login')">Annulla</button>
    </div>

    <div id="view-teacher" class="box">
        <div style="display:flex; justify-content:space-between; align-items:center">
            <h2>👨‍🏫 Prof. <span id="teacher-name-display"></span></h2>
            <button class="secondary small" onclick="logout()">Esci</button>
        </div>

        <div class="filter-bar">
            <strong>Filtra per Classe:</strong>
            <select id="filter-class" onchange="renderStudentTable()" style="width: auto; flex-grow:1">
                <option value="ALL">Caricamento classi...</option>
            </select>
            <button class="small" onclick="loadStudents()">🔄 Aggiorna</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Studente (Cognome Nome)</th>
                    <th>Classe</th>
                    <th>Azione</th>
                </tr>
            </thead>
            <tbody id="student-table-body">
            </tbody>
        </table>
    </div>

    <div id="view-student" class="box">
        <div style="display:flex; justify-content:space-between; align-items:center">
            <h2>🎓 Ciao, <span id="student-name-display"></span></h2>
            <button class="secondary small" onclick="logout()">Esci</button>
        </div>
        <p>Ecco la tua situazione scolastica:</p>
        <div id="lista-medie" style="margin-bottom: 20px;"></div>
        <hr>
        <h3>Storico Voti</h3>
        <div id="lista-voti"></div>
    </div>

    <script>
        // --- CONFIGURAZIONE: INCOLLA QUI I NUOVI VALORI SE CAMBIANO ---
        const poolData = {
            UserPoolId: 'eu-central-1_JJ7KlMNcu',
            ClientId: '4vq33ie3iig4918jchrhhfhcql'
        };
        const apiBaseUrl = 'https://e9etb79cjh.execute-api.eu-central-1.amazonaws.com/';
        // --------------------------------------------------------------

        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
        let currentUser;
        let userData = {}; // Contiene nome, cognome, ruolo
        let allStudents = [];

        function switchView(viewId) {
            document.querySelectorAll('.box').forEach(el => el.classList.remove('visible'));
            document.getElementById(viewId).classList.add('visible');
        }

        function toggleClasseInput() {
            const role = document.getElementById('reg-role').value;
            const classInput = document.getElementById('reg-class');
            if (role === 'Teacher') classInput.style.display = 'none';
            else classInput.style.display = 'block';
        }

        // --- AUTH ---
        function register() {
            const nome = document.getElementById('reg-name').value;
            const cognome = document.getElementById('reg-surname').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const role = document.getElementById('reg-role').value;
            let classe = document.getElementById('reg-class').value.toUpperCase();

            if (role === 'Teacher') classe = 'N/A';

            const attributeList = [
                new AmazonCognitoIdentity.CognitoUserAttribute({ Name: "email", Value: email }),
                new AmazonCognitoIdentity.CognitoUserAttribute({ Name: "given_name", Value: nome }),
                new AmazonCognitoIdentity.CognitoUserAttribute({ Name: "family_name", Value: cognome }),
                new AmazonCognitoIdentity.CognitoUserAttribute({ Name: "custom:role", Value: role }),
                new AmazonCognitoIdentity.CognitoUserAttribute({ Name: "custom:classe", Value: classe })
            ];

            userPool.signUp(email, pass, attributeList, null, (err, result) => {
                if (err) { alert(err.message || JSON.stringify(err)); return; }
                alert('Account creato! Controlla la mail per la password o usa lo script per settarla.');
                switchView('view-login');
            });
        }

        function login() {
            const email = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            const cognitoUser = new AmazonCognitoIdentity.CognitoUser({ Username: email, Pool: userPool });

            cognitoUser.authenticateUser(new AmazonCognitoIdentity.AuthenticationDetails({ Username: email, Password: pass }), {
                onSuccess: (result) => {
                    currentUser = cognitoUser;
                    currentUser.getUserAttributes((err, attrs) => {
                        if (err) return;
                        // Estrai attributi
                        userData = {};
                        attrs.forEach(a => { userData[a.getName()] = a.getValue(); });

                        const fullName = `${userData['given_name'] || ''} ${userData['family_name'] || ''}`.trim() || email;
                        const role = userData['custom:role'] || 'Student';

                        if (role === 'Teacher') {
                            document.getElementById('teacher-name-display').innerText = fullName;
                            setupTeacher();
                        } else {
                            document.getElementById('student-name-display').innerText = fullName;
                            setupStudent(email);
                        }
                    });
                },
                onFailure: (err) => alert("Errore Login: " + err.message),
                newPasswordRequired: (attrs) => {
                    const newPw = prompt("Primo accesso. Nuova password:");
                    if (newPw) cognitoUser.completeNewPasswordChallenge(newPw, {}, { onSuccess: () => login() });
                }
            });
        }

        function logout() { if (currentUser) currentUser.signOut(); location.reload(); }

        // --- LOGICA DOCENTE ---
        async function setupTeacher() {
            switchView('view-teacher');
            await loadStudents();
        }

        async function loadStudents() {
            try {
                const res = await fetch(apiBaseUrl + "/voto", {
                    method: 'POST',
                    body: JSON.stringify({ action: 'get_students' })
                });
                const data = await res.json();

                if (data.students && data.classes) {
                    allStudents = data.students;
                    populateClassFilter(data.classes); // Popola menu a tendina
                    renderStudentTable();
                } else {
                    alert("Errore caricamento dati");
                }
            } catch (e) { console.error(e); }
        }

        function populateClassFilter(classes) {
            const select = document.getElementById('filter-class');
            select.innerHTML = '<option value="ALL">Tutte le classi</option>';
            classes.forEach(cls => {
                select.innerHTML += `<option value="${cls}">${cls}</option>`;
            });
        }

        function renderStudentTable() {
            const filter = document.getElementById('filter-class').value;
            const tbody = document.getElementById('student-table-body');
            tbody.innerHTML = '';

            const filtered = filter === 'ALL' ? allStudents : allStudents.filter(s => s.classe === filter);

            filtered.forEach(s => {
                tbody.innerHTML += `
                <tr>
                    <td><b>${s.display_name}</b> <br><small>${s.email}</small></td>
                    <td><span style="background:#ddd; padding:2px 6px; border-radius:4px">${s.classe}</span></td>
                    <td><button class="small" onclick="apriVoto('${s.email}', '${s.display_name}')">Voto</button></td>
                </tr>`;
            });

            if (filtered.length === 0) tbody.innerHTML = '<tr><td colspan="3">Nessuno studente trovato.</td></tr>';
        }

        async function apriVoto(studentEmail, studentName) {
            const materia = prompt(`Materia per ${studentName}:`, "Matematica");
            if (!materia) return;
            const voto = prompt("Voto (1-10):");
            if (!voto) return;

            const teacherName = document.getElementById('teacher-name-display').innerText;

            try {
                const res = await fetch(apiBaseUrl + "/voto", {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'add_grade',
                        teacher_name: teacherName,
                        student_email: studentEmail,
                        materia: materia,
                        voto: voto
                    })
                });
                if (res.ok) alert("✅ Voto inviato!");
                else alert("Errore invio voto");
            } catch (e) { alert("Errore: " + e); }
        }

        // --- LOGICA STUDENTE ---
        async function setupStudent(email) {
            switchView('view-student');
            try {
                const res = await fetch(apiBaseUrl + "/voto?email=" + email);
                const data = await res.json();

                const divMedie = document.getElementById('lista-medie');
                divMedie.innerHTML = "";
                if (data.medie) {
                    for (const [mat, med] of Object.entries(data.medie)) {
                        divMedie.innerHTML += `<p><b>${mat}</b>: <span class="media-badge">${med}</span></p>`;
                    }
                }

                const divVoti = document.getElementById('lista-voti');
                divVoti.innerHTML = "";
                (data.voti || []).forEach(v => {
                    divVoti.innerHTML += `<div class="voto-card">
                        <strong>${v.materia}</strong>: ${v.voto} <br> 
                        <small>Prof: ${v.teacher} - Data: ${v.data.substring(0, 10)}</small>
                    </div>`;
                });
            } catch (e) { console.error(e); }
        }
    </script>
</body>

</html>
