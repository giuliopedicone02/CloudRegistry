<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Registry</title>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1000.0.min.js"></script>
    <script src="https://unpkg.com/amazon-cognito-identity-js@5.2.9/dist/amazon-cognito-identity.min.js"></script>
    <style>
        /* --- STILI ORIGINALI MANTENUTI E INTEGRATI --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #e63946;
            --secondary: #6c757d;
            --success: #2a9d8f;
            --danger: #e63946;
            --warning: #f77f00;
            --dark: #1d3557;
            --purple: #d63384;
            --gradient: linear-gradient(135deg, #e63946 0%, #a8001e 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e63946 0%, #a8001e 100%);
            min-height: 100vh;
            padding: 1rem;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .box {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: none;
            margin-bottom: 20px;
            animation: slideUp 0.4s ease-out;
        }

        .visible {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1,
        h2,
        h3 {
            color: inherit;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 2rem;
        }

        h2 {
            color: var(--primary);
        }

        h3 {
            border-left: 4px solid var(--primary);
            padding-left: 1rem;
            color: var(--dark);
            margin-top: 1.5rem;
        }

        input,
        select,
        textarea,
        button {
            width: 100%;
            margin: 8px 0;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            font-size: 1rem;
        }

        button {
            background: var(--gradient);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
        }

        button.secondary {
            background: var(--secondary);
            box-shadow: none;
        }

        button.small {
            width: auto;
            padding: 8px 20px;
            font-size: 0.9rem;
            text-transform: none;
        }

        button.danger {
            background: var(--primary);
        }

        button.icon-btn {
            background: transparent;
            border: none;
            color: #e63946;
            font-size: 1.2rem;
            padding: 5px;
            box-shadow: none;
            cursor: pointer;
            width: auto;
        }

        button.icon-btn:hover {
            background: #fee;
            border-radius: 50%;
            transform: scale(1.1);
        }

        .table-container {
            overflow-x: auto;
            margin-top: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--gradient);
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }

        .grade-card,
        .nota-card {
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            position: relative;
        }

        .grade-card {
            background: white;
            border-left: 5px solid var(--success);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .nota-card {
            background: #fff0f6;
            border-left: 5px solid var(--purple);
        }

        /* Modal & Toasts */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: white;
            padding: 1rem 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 2000;
        }

        .toast.success {
            border-left: 5px solid var(--success);
        }

        .toast.error {
            border-left: 5px solid var(--danger);
        }

        .toast.active {
            display: block;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }

        .loading {
            text-align: center;
            color: #888;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .delete-corner {
            position: absolute;
            top: 10px;
            right: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>☁️ Cloud Registry</h1>

        <div id="view-login" class="box visible">
            <h2 style="text-align:center">🔐 Accedi</h2>
            <input type="text" id="login-user" placeholder="📧 Email">
            <input type="password" id="login-pass" placeholder="🔒 Password">
            <button onclick="login()">Accedi</button>
            <button class="secondary" onclick="switchView('view-register')">Crea nuovo account</button>
        </div>

        <div id="view-register" class="box">
            <h2>📝 Registrazione</h2>
            <input type="text" id="reg-name" placeholder="Nome">
            <input type="text" id="reg-surname" placeholder="Cognome">
            <input type="text" id="reg-email" placeholder="Email">
            <input type="password" id="reg-pass" placeholder="Password">
            <select id="reg-role" onchange="toggleClasseInput()">
                <option value="Student">Studente</option>
                <option value="Teacher">Docente</option>
            </select>
            <input type="text" id="reg-class" placeholder="Classe (es. 5A)">
            <button onclick="register()">Crea Account</button>
            <button class="secondary" onclick="switchView('view-login')">Annulla</button>
        </div>

        <div id="view-verify" class="box">
            <h2>📩 Verifica Email</h2>
            <input type="text" id="verify-email" placeholder="Email" readonly style="background:#eee">
            <input type="text" id="verify-code" placeholder="Codice OTP">
            <button onclick="confirmVerification()">Conferma</button>
        </div>

        <div id="view-teacher" class="box">
            <div class="profile-header">
                <div>
                    <h2>👨‍🏫 <span id="teacher-name-display"></span></h2>
                    <small>Docente</small>
                </div>
                <button class="secondary small" onclick="logout()">Esci</button>
            </div>

            <div style="display:flex; gap:10px;">
                <select id="filter-class" onchange="renderStudentTable()">
                    <option value="ALL">Caricamento...</option>
                </select>
                <button class="small" onclick="loadStudents()">🔄</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Studente</th>
                            <th>Classe</th>
                            <th>Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body"></tbody>
                </table>
            </div>
        </div>

        <div id="view-student" class="box">
            <div class="profile-header">
                <div>
                    <h2>🎓 <span id="student-name-display"></span></h2>
                    <small>Studente</small>
                </div>
                <button class="secondary small" onclick="logout()">Esci</button>
            </div>
            <h3>📊 Medie</h3>
            <div id="lista-medie"
                style="display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:10px;"></div>
            <h3>📚 Voti</h3>
            <div id="lista-voti"></div>
            <h3>⚠️ Note</h3>
            <div id="student-notes-list"></div>
        </div>

        <div id="view-notes" class="box">
            <div class="profile-header">
                <h3>⚠️ Note: <span id="note-student-name"></span></h3>
                <button class="secondary small" onclick="switchView('view-teacher')">Chiudi</button>
            </div>

            <div id="lista-note" style="max-height:300px; overflow-y:auto; margin-bottom:1rem;"></div>

            <textarea id="note-text" placeholder="Scrivi una nuova nota..."></textarea>
            <button onclick="inviaNota()" class="danger">Invia Nota</button>
        </div>
    </div>

    <div id="voto-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>📝 Nuovo Voto per <span id="modal-student-name"></span></h3>
            <input type="text" id="modal-materia" placeholder="Materia">
            <input type="text" id="modal-voto" placeholder="Voto">
            <div style="display:flex; gap:10px; margin-top:1rem;">
                <button onclick="confermaVoto()">Salva</button>
                <button class="secondary"
                    onclick="document.getElementById('voto-modal').classList.remove('active')">Annulla</button>
            </div>
        </div>
    </div>

    <div id="history-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="profile-header">
                <h3>📜 Storico Voti: <span id="history-student-name"></span></h3>
                <button class="icon-btn"
                    onclick="document.getElementById('history-modal').classList.remove('active')">✖</button>
            </div>
            <div id="history-list" style="max-height:400px; overflow-y:auto;">
                <div class="loading">
                    <div class="spinner"></div>Caricamento...
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="config.js"></script>

    <script>
        if (typeof window.apiConfig === 'undefined') alert("Errore: config.js mancante.");

        const poolData = { UserPoolId: window.apiConfig.UserPoolId, ClientId: window.apiConfig.ClientId };
        const apiBaseUrl = window.apiConfig.ApiUrl;
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
        let currentUser;
        let userData = {};
        let allStudents = [];
        let NOTE_API_URL = null;
        let currentStudentEmail = null;

        // --- UTILS ---
        function switchView(viewId) {
            document.querySelectorAll('.box').forEach(el => el.classList.remove('visible'));
            document.getElementById(viewId).classList.add('visible');
        }

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.className = 'toast ' + type;
            t.innerText = (type == 'success' ? '✅ ' : '❌ ') + msg;
            t.classList.add('active');
            setTimeout(() => t.classList.remove('active'), 3000);
        }

        function toggleClasseInput() {
            const role = document.getElementById('reg-role').value;
            document.getElementById('reg-class').style.display = (role === 'Teacher') ? 'none' : 'block';
        }

        // --- AUTH ---
        function register() {
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const role = document.getElementById('reg-role').value;
            const attr = [
                new AmazonCognitoIdentity.CognitoUserAttribute({ Name: "email", Value: email }),
                new AmazonCognitoIdentity.CognitoUserAttribute({ Name: "given_name", Value: document.getElementById('reg-name').value }),
                new AmazonCognitoIdentity.CognitoUserAttribute({ Name: "family_name", Value: document.getElementById('reg-surname').value }),
                new AmazonCognitoIdentity.CognitoUserAttribute({ Name: "custom:role", Value: role }),
                new AmazonCognitoIdentity.CognitoUserAttribute({ Name: "custom:classe", Value: role === 'Teacher' ? 'N/A' : document.getElementById('reg-class').value })
            ];
            userPool.signUp(email, pass, attr, null, (err) => {
                if (err) return showToast(err.message, 'error');
                showToast("Codice inviato via mail");
                document.getElementById('verify-email').value = email;
                switchView('view-verify');
            });
        }

        function confirmVerification() {
            const usr = new AmazonCognitoIdentity.CognitoUser({ Username: document.getElementById('verify-email').value, Pool: userPool });
            usr.confirmRegistration(document.getElementById('verify-code').value, true, (err) => {
                if (err) return showToast(err.message, 'error');
                showToast("Verificato! Fai login"); switchView('view-login');
            });
        }

        function login() {
            const email = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            const usr = new AmazonCognitoIdentity.CognitoUser({ Username: email, Pool: userPool });

            usr.authenticateUser(new AmazonCognitoIdentity.AuthenticationDetails({ Username: email, Password: pass }), {
                onSuccess: () => {
                    currentUser = usr;
                    loadUserProfile(); // Funzione separata per pulizia
                },
                onFailure: (err) => showToast(err.message, 'error')
            });
        }

        // Carica i dati utente e decide dove andare
        function loadUserProfile() {
            currentUser.getUserAttributes((err, attrs) => {
                if (err) return;
                userData = {};
                attrs.forEach(a => userData[a.getName()] = a.getValue());

                const name = `${userData['given_name']} ${userData['family_name']}`;
                const role = userData['custom:role'] || 'Student';
                const email = userData['email'];

                if (role === 'Teacher') {
                    document.getElementById('teacher-name-display').innerText = name;
                    document.getElementById('teacher-avatar').innerText = name.charAt(0).toUpperCase();
                    setupTeacher();
                } else {
                    document.getElementById('student-name-display').innerText = name;
                    document.getElementById('student-avatar').innerText = name.charAt(0).toUpperCase();
                    setupStudent(email);
                }
            });
        }

        function logout() {
            if (currentUser) currentUser.signOut();
            location.reload();
        }

        // --- INFRA ---
        async function ensureDockerIP() {
            if (NOTE_API_URL) return true;
            try {
                const res = await fetch(apiBaseUrl + "/voto", { method: 'POST', body: JSON.stringify({ action: 'get_container_ip' }) });
                const data = await res.json();
                if (data.ip) { NOTE_API_URL = "http://" + data.ip; return true; }
            } catch (e) { console.error(e); }
            return false;
        }

        // --- DOCENTE MAIN ---
        async function setupTeacher() { switchView('view-teacher'); loadStudents(); }
        async function loadStudents() {
            const res = await fetch(apiBaseUrl + "/voto", { method: 'POST', body: JSON.stringify({ action: 'get_students' }) });
            const data = await res.json();
            if (data.students) {
                allStudents = data.students;
                const sel = document.getElementById('filter-class');
                sel.innerHTML = '<option value="ALL">Tutte le classi</option>';
                data.classes.forEach(c => sel.innerHTML += `<option value="${c}">${c}</option>`);
                renderStudentTable();
            }
        }
        function renderStudentTable() {
            const filter = document.getElementById('filter-class').value;
            const tbody = document.getElementById('student-table-body');
            tbody.innerHTML = '';
            const list = filter === 'ALL' ? allStudents : allStudents.filter(s => s.classe === filter);

            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="empty-state"><div class="empty-state-icon">📭</div><p>Nessuno studente trovato</p></td></tr>';
                return;
            }

            list.forEach(s => {
                tbody.innerHTML += `<tr>
                    <td><b>${s.display_name}</b><br><small>${s.email}</small></td>
                    <td><span style="background:var(--gradient); color:white; padding:4px 12px; border-radius:20px">${s.classe}</span></td>
                    <td>
                        <div class="button-row">
                            <button class="small" onclick="apriVoto('${s.email}', '${s.display_name}')">📝 Voto</button>
                            <button class="small secondary" onclick="apriStoricoVoti('${s.email}', '${s.display_name}')">📜 Storico</button>
                            <button class="small danger" onclick="apriNoteTeacher('${s.email}', '${s.display_name}')">⚠️ Note</button>
                        </div>
                    </td>
                </tr>`;
            });
        }

        // --- CRUD VOTI DOCENTE ---
        function apriVoto(email, name) {
            currentStudentEmail = email;
            document.getElementById('modal-student-name').innerText = name;
            document.getElementById('voto-modal').classList.add('active');
            document.getElementById('modal-materia').value = '';
            document.getElementById('modal-voto').value = '';
            document.getElementById('modal-materia').focus();
        }

        async function confermaVoto() {
            const mat = document.getElementById('modal-materia').value;
            const voto = document.getElementById('modal-voto').value;
            if (!mat || !voto) return showToast("Compila tutti i campi", "error");
            const teacher = document.getElementById('teacher-name-display').innerText;

            await fetch(apiBaseUrl + "/voto", { method: 'POST', body: JSON.stringify({ action: 'add_grade', teacher_name: teacher, student_email: currentStudentEmail, materia: mat, voto: voto }) });
            showToast("Voto inserito");
            document.getElementById('voto-modal').classList.remove('active');
        }

        async function apriStoricoVoti(email, name) {
            currentStudentEmail = email;
            document.getElementById('history-student-name').innerText = name;
            document.getElementById('history-modal').classList.add('active');
            const list = document.getElementById('history-list');
            list.innerHTML = '<div class="loading"><div class="spinner"></div>Caricamento...</div>';

            const res = await fetch(apiBaseUrl + "/voto?email=" + email);
            const data = await res.json();

            list.innerHTML = '';
            if (!data.voti || data.voti.length === 0) {
                list.innerHTML = '<p style="text-align:center; padding:20px;">Nessun voto presente.</p>';
                return;
            }

            data.voti.forEach(v => {
                if (v.voto) {
                    const sk_ricostruito = `VOTO#${v.data}`;
                    list.innerHTML += `
                    <div class="grade-card" style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <strong>${v.materia}</strong>: <span style="font-size:1.2rem; font-weight:bold">${v.voto}</span><br>
                            <small>${new Date(v.data).toLocaleDateString()} - Prof. ${v.teacher}</small>
                        </div>
                        <button class="icon-btn" onclick="cancellaVoto('${sk_ricostruito}')">🗑️</button>
                    </div>`;
                }
            });
        }

        async function cancellaVoto(sk) {
            if (!confirm("Sicuro di voler eliminare questo voto?")) return;
            try {
                const res = await fetch(apiBaseUrl + "/voto", {
                    method: 'POST', body: JSON.stringify({ action: 'delete_grade', student_email: currentStudentEmail, sk: sk })
                });
                if (res.ok) {
                    showToast("Voto eliminato");
                    apriStoricoVoti(currentStudentEmail, document.getElementById('history-student-name').innerText);
                } else showToast("Errore cancellazione", "error");
            } catch (e) { showToast(e.message, "error"); }
        }

        // --- CRUD NOTE DOCENTE ---
        async function apriNoteTeacher(email, name) {
            currentStudentEmail = email;
            document.getElementById('note-student-name').innerText = name;
            switchView('view-notes');
            document.getElementById('lista-note').innerHTML = '<div class="loading"><div class="spinner"></div>Connessione Docker...</div>';
            if (await ensureDockerIP()) loadNotes(email, 'lista-note', true);
            else document.getElementById('lista-note').innerHTML = "<p style='color:red; text-align:center;'>Container Docker spento o irraggiungibile</p>";
        }

        async function inviaNota() {
            const txt = document.getElementById('note-text').value;
            const teacher = document.getElementById('teacher-name-display').innerText;
            if (!txt) return showToast("Scrivi qualcosa", "error");
            await fetch(`${NOTE_API_URL}/note`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ student_email: currentStudentEmail, testo: txt, teacher: teacher })
            });
            showToast("Nota inserita");
            document.getElementById('note-text').value = '';
            loadNotes(currentStudentEmail, 'lista-note', true);
        }

        async function cancellaNota(sk) {
            if (!confirm("Eliminare questa nota?")) return;
            try {
                const res = await fetch(`${NOTE_API_URL}/note`, {
                    method: 'DELETE', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_email: currentStudentEmail, sk: sk })
                });
                if (res.ok) {
                    showToast("Nota eliminata");
                    loadNotes(currentStudentEmail, 'lista-note', true);
                } else showToast("Errore cancellazione", "error");
            } catch (e) { console.error(e); }
        }

        // --- STUDENTE ---
        async function setupStudent(email) {
            switchView('view-student');
            const res = await fetch(apiBaseUrl + "/voto?email=" + email);
            const data = await res.json();

            const divM = document.getElementById('lista-medie'); divM.innerHTML = '';
            if (data.medie && Object.keys(data.medie).length > 0) {
                for (const [m, v] of Object.entries(data.medie))
                    if (m !== 'Sconosciuta') divM.innerHTML += `<div class="average-card"><div class="average-subject">${m}</div><div class="average-value">${v}</div></div>`;
            } else divM.innerHTML = '<p style="color:#666">Nessuna media.</p>';

            const divV = document.getElementById('lista-voti'); divV.innerHTML = '';
            if (data.voti && data.voti.length > 0) {
                data.voti.forEach(v => {
                    if (v.voto) divV.innerHTML += `
                        <div class="grade-card">
                            <div class="grade-header"><div class="grade-subject">${v.materia}</div><div class="grade-value">${v.voto}</div></div>
                            <div class="grade-meta"><small>Data: ${new Date(v.data).toLocaleDateString()} - Prof: ${v.teacher || 'ND'}</small></div>
                        </div>`;
                });
            } else divV.innerHTML = '<p style="color:#666">Nessun voto.</p>';

            const divN = document.getElementById('student-notes-list');
            divN.innerHTML = '<div class="loading"><div class="spinner"></div>Connessione Docker...</div>';
            if (await ensureDockerIP()) loadNotes(email, 'student-notes-list', false);
            else divN.innerHTML = "<p style='color:red'>Servizio note non disponibile</p>";
        }

        // --- SHARED: CARICAMENTO NOTE ---
        async function loadNotes(email, divId, isTeacher) {
            const div = document.getElementById(divId);
            try {
                const res = await fetch(`${NOTE_API_URL}/note?email=${email}`);
                const notes = await res.json();
                div.innerHTML = '';
                if (notes.length === 0) div.innerHTML = "<div class='empty-state'><div class='empty-state-icon'>✅</div><p>Nessuna nota</p></div>";
                else notes.forEach(n => {
                    let btn = isTeacher ? `<button class="delete-corner icon-btn" onclick="cancellaNota('${n.SK}')">🗑️</button>` : '';
                    div.innerHTML += `
                    <div class="nota-card">
                        ${btn}
                        <p style="margin:0; font-size:1.1rem">"${n.testo}"</p>
                        <small style="color:#666; margin-top:5px; display:block">Prof: ${n.teacher} - ${new Date(n.data).toLocaleDateString()}</small>
                    </div>`;
                });
            } catch (e) { div.innerHTML = '<p style="color:red">Errore caricamento note</p>'; }
        }

        // --- CHECK SESSION AL CARICAMENTO (EVITA LOGOUT SU F5) ---
        (function checkSession() {
            const cognitoUser = userPool.getCurrentUser();
            if (cognitoUser != null) {
                cognitoUser.getSession(function (err, session) {
                    if (session.isValid()) {
                        currentUser = cognitoUser;
                        loadUserProfile(); // Ripristina la vista corretta
                    }
                });
            }
        })();

    </script>
</body>

</html>
